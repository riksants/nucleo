    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Núcleo" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Theme before the first paint (no flash): the choice in Configurações → Aparência, else the device setting.
      (function () {
        var pref = 'auto'
        try { pref = JSON.parse(localStorage.getItem('nucleo:theme')) || 'auto' } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name=theme-color]').content = dark ? '#0a0a0b' : '#efede8'
        // iOS (installed app): light text on dark, dark text on light. Read when the app opens.
        if (!dark) document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]').content = 'default'
      })()
    </script>

    <title>Núcleo</title>
    <style>
      /* Opening (painted before any script, CSS so it stays smooth while the app loads underneath):
         still "N" → a narrow vermilion capsule rises (its head carries a mini "N") → it widens to the
         whole screen → src/app/opening.ts slides the vermilion up and away, revealing the real app. */
      html, body { background: #0a0a0b; }
      html[data-theme="light"], html[data-theme="light"] body { background: #efede8; }
      #splash { --w: min(24.6vw, 13.8vh); position: fixed; inset: 0; z-index: 2147483000; overflow: hidden; background: #0a0a0b; touch-action: none;
        animation: nl-fallback 300ms ease 8s forwards; }
      .nl-logo { position: absolute; left: 50%; top: 47.9%; width: min(22.6vw, 12.7vh); height: auto; transform: translate(-50%, -50%); opacity: 0;
        animation: nl-fade 300ms cubic-bezier(0.23, 1, 0.32, 1) forwards; }
      .nl-sheet { position: absolute; left: 0; right: 0; top: calc(var(--w) * -1); height: calc(100% + var(--w) * 2); overflow: hidden; background: #ff5b2e;
        clip-path: inset(calc(100% - var(--w)) calc(50% - var(--w) / 2) 0 calc(50% - var(--w) / 2) round calc(var(--w) / 2));
        animation: nl-rise 1060ms 1040ms both; will-change: clip-path; }
      .nl-base { position: absolute; inset: 0; width: 100%; height: 100%; }
      /* As in the reference: inside the narrow capsule the waves are small and stream upwards; as it widens they
         grow to full size and settle with inertia (at rest by ~2.25 s). The layer repeats, so it never shows an edge. */
      .nl-waves { position: absolute; left: -50%; top: -100%; width: 200%; height: 300%; transform: translate3d(0, 9%, 0) scale(0.5);
        animation: nl-drift 1210ms 1040ms both; will-change: transform; }
      .nl-head { position: absolute; left: calc(50% - var(--w) / 2); top: calc(var(--w) * -1); width: var(--w); height: var(--w); border-radius: 50%;
        display: grid; place-items: center; background: #0a0a0b; box-shadow: inset 0 0 0 max(2px, calc(var(--w) * 0.06)) #edebe6;
        transform: translateY(calc(100vh + var(--w))); transform: translateY(calc(100dvh + var(--w)));
        animation: nl-head 640ms cubic-bezier(0.53, 0.33, 0.37, 0.68) 1040ms both; will-change: transform; }
      .nl-head svg { width: 46%; height: auto; }
      /* Timings and curves measured from the reference video (fitted within 2.5 px):
         rise 640 ms → hold as a full-height column 70 ms → widen 350 ms, accelerating to the edges. */
      @keyframes nl-rise {
        0% { clip-path: inset(calc(100% - var(--w)) calc(50% - var(--w) / 2) 0 calc(50% - var(--w) / 2) round calc(var(--w) / 2)); animation-timing-function: cubic-bezier(0.53, 0.33, 0.37, 0.68); }
        60.38% { clip-path: inset(0 calc(50% - var(--w) / 2) 0 calc(50% - var(--w) / 2) round calc(var(--w) / 2)); animation-timing-function: linear; }
        66.98% { clip-path: inset(0 calc(50% - var(--w) / 2) 0 calc(50% - var(--w) / 2) round calc(var(--w) / 2)); animation-timing-function: cubic-bezier(0.7, -0.03, 0.79, 0.76); }
        100% { clip-path: inset(0 0 0 0 round 0); }
      }
      @keyframes nl-head {
        from { transform: translateY(calc(100vh + var(--w))); transform: translateY(calc(100dvh + var(--w))); }
        to { transform: translateY(0); }
      }
      @keyframes nl-drift {
        0% { transform: translate3d(0, 9%, 0) scale(0.5); animation-timing-function: linear; }
        58% { transform: translate3d(0, 2.5%, 0) scale(0.5); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
        100% { transform: translate3d(0, 0, 0) scale(1); }
      }
      @keyframes nl-fade { to { opacity: 1; } }
      /* Reveal: the vermilion slides up and leaves through the top (same direction as the capsule). */
      #splash.nl-leave { background: transparent; }
      .nl-leave .nl-logo, .nl-leave .nl-head { display: none; }
      .nl-leave .nl-sheet { animation: nl-out 560ms cubic-bezier(0.77, 0, 0.175, 1) forwards; }
      @keyframes nl-out {
        from { clip-path: inset(0 0 0 0 round 0); transform: translateY(0); }
        to { clip-path: inset(0 0 var(--w) 0 round 0 0 28px 28px); transform: translateY(-100%); }
      }
      /* Never block the app, even if the script never runs. */
      @keyframes nl-fallback { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .nl-sheet, .nl-head { display: none; }
        .nl-logo { animation: none; opacity: 1; }
      }
    </style>
