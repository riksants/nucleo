        const pay = { label: next ? next.label : 'Pagamento', info: 'Recebido hoje · Pix', v, done: true };
        const before = p.payments.slice();
        if (next && v >= next.v) { p.payments[p.payments.indexOf(next)] = pay; } else { if (next) next.v = Math.max(0, next.v - v); p.payments.push(pay); }
        const tx = { id: nid(), day: 'Hoje', title: p.client, cat: 'Projeto · ' + pay.label + ' · Pix', icon: 'dollar', tone: 'green', v, added: true };
        S.tx.unshift(tx); bump(v);
        return [`Pagamento de ${brl(v)} registrado`, () => { p.payments = before; S.tx = S.tx.filter((x) => x !== tx); }];
      });
  }
  function openMoneyForm(kind, editId) {
    const tx = editId && S.tx.find((t) => t.id === editId);
    const isOut = kind === 'out';
    const cats = isOut ? ['Alimentação', 'Transporte', 'Moradia', 'Saúde', 'Lazer', 'Assinatura'] : ['Projeto', 'Venda', 'Salário', 'Reembolso', 'Outro'];
    const amount = tx ? (Math.abs(tx.v) / 100).toFixed(2).replace('.', ',') : '';
    openForm(tx ? (isOut ? 'Editar saída' : 'Editar entrada') : isOut ? 'Nova saída' : 'Nova entrada', `
      <div class="seg" role="radiogroup" aria-label="Tipo"><button type="button" role="radio" aria-checked="${isOut}" data-kind="out">Saída</button><button type="button" role="radio" aria-checked="${!isOut}" data-kind="in">Entrada</button></div>
      <div class="amount"><label for="amt">${isOut ? 'Quanto saiu' : 'Quanto entrou'}</label><div class="wrap"><span class="cur">R$</span><input id="amt" data-autofocus inputmode="decimal" placeholder="0,00" value="${amount}" autocomplete="off"></div></div>
      <label class="field"><span>${isOut ? 'Com o quê' : 'De onde veio'}</span><input id="desc" placeholder="${isOut ? 'Mercado, Uber, aluguel…' : 'Cliente, venda, salário…'}" value="${tx ? esc(tx.title) : ''}" autocomplete="off"></label>
      <div class="field"><span>Categoria</span>${chipsPick('categoria', cats, cats[0])}</div>
      <label class="field"><span>Data</span><input type="date" value="2026-11-06"></label>
      ${more('Moeda, forma de pagamento, repetir, observação, comprovante', `<div class="two"><label class="field"><span>Moeda</span><select><option>Real (R$)</option><option>Euro (€)</option><option>Dólar (US$)</option></select></label><label class="field"><span>Forma</span><select><option>Pix</option><option>Crédito</option><option>Débito</option><option>Dinheiro</option></select></label></div><label class="field"><span>Repetir</span><select><option>Não repetir</option><option>Todo mês</option><option>Toda semana</option></select></label><label class="field"><span>Observação</span><textarea placeholder="Opcional"></textarea></label><button class="btn block" type="button" style="margin-top:12px" data-toast="${DEMO}abriria a câmera ou os arquivos">${ico('upload', 's')} Anexar comprovante</button>`)}`,
      tx ? 'Salvar alterações' : isOut ? 'Salvar saída' : 'Salvar entrada', ['amt'], () => {
        const c = cents(val('amt')), desc = val('desc').trim() || (isOut ? 'Saída' : 'Entrada');
        if (tx) { const old = { ...tx }; tx.title = desc; return ['Alterações salvas', () => Object.assign(tx, old)]; }
        const item = { id: nid(), day: 'Hoje', title: desc, cat: picked('categoria'), icon: isOut ? 'tag' : 'dollar', tone: isOut ? 'amber' : 'green', v: isOut ? -c : c, added: true };
        S.tx.unshift(item); bump(item.v);
        return [`${isOut ? 'Saída' : 'Entrada'} de ${brl(c)} salva`, () => { S.tx = S.tx.filter((x) => x !== item); }];
      });
    sheet.el.dataset.edit = editId || '';
  }
  function openNew() {
    const all = [['task', 'Tarefa', 'task', 'blue', 'data-form-task'], ['cal', 'Compromisso', 'cal', 'orange', 'data-form-event'], ['out', 'Saída', 'minus', 'red', 'data-form="out"'], ['in', 'Entrada', 'plus', 'green', 'data-form="in"'], ['proj', 'Projeto', 'folder', 'blue', 'data-form-project'], ['sale', 'Venda', 'dollar', 'green', `data-toast="${DEMO}abriria Nova venda"`], ['note', 'Anotação', 'note', '', `data-toast="${DEMO}abriria Nova anotação"`], ['habit', 'Hábito', 'sprout', 'green', `data-toast="${DEMO}abriria Novo hábito"`]];
    openSheet('Novo', `
      <label class="search">${ico('sparkle', 's')}<span class="sr">Escreva o que quer registrar</span><input id="say" data-autofocus placeholder="Ex.: reunião com Ana amanhã às 15h" autocomplete="off"></label>
      <div id="guess"></div>
      <div class="part">Ou escolha</div>
      <div class="types">${all.map(([, l, i, tone, attr]) => `<button class="type" type="button" ${attr}><span class="tile ${tone}">${ico(i)}</span>${l}</button>`).join('')}</div>
      <div class="group" style="margin-top:12px"><button class="row" type="button" data-toast="${DEMO}guardaria na Caixa de entrada"><span class="tile">${ico('inbox', 's')}</span><span class="t"><span class="t1">Guardar para organizar depois</span><span class="t2">Vai para a Caixa de entrada</span></span>${ico('chev', 's chev')}</button></div>`);
  }
  function guess(text) {
    const t = text.toLowerCase();
    if (!t.trim()) return '';
    let kind = 'Tarefa', detail = 'sem data';
    const hour = (t.match(/(\d{1,2})h/) || [])[1];
    if (/r\$|gastei|paguei/.test(t)) { kind = 'Saída'; detail = 'hoje'; }
    else if (/recebi|entrou/.test(t)) { kind = 'Entrada'; detail = 'hoje'; }
    else if (/reuni|call|consulta|dentista/.test(t) || hour) { kind = 'Compromisso'; detail = (/amanh/.test(t) ? 'amanhã' : 'hoje') + (hour ? ' às ' + hour + ':00' : ''); }
    else if (/amanh/.test(t)) detail = 'amanhã';
    return `<div class="guess"><span class="tile orange">${ico('sparkle', 's')}</span><span style="flex:1;min-width:0"><b>${kind} · ${detail}</b><small>${esc(text)}</small></span><button class="btn sm dark" type="button" data-toast="${DEMO}salvaria: ${kind.toLowerCase()} ${detail}">Salvar</button></div>`;
  }
  const SHEETS = {
    moeda: () => openSheet('Moeda de exibição', `
      <p style="margin:0 2px 12px;color:var(--soft);font-size:15px">Muda só como o saldo aparece. Os valores continuam guardados na moeda em que foram registrados.</p>
      <div class="group">${Object.entries({ BRL: 'Real', EUR: 'Euro', USD: 'Dólar americano' }).map(([k, n]) => `<button class="row notile" type="button" data-cur-set="${k}"><span class="t"><span class="t1">${n}</span><span class="t2">${k} · ${RATES[k].sym}</span></span>${S.cur === k ? ico('check', 's') : ''}</button>`).join('')}</div>
      <p style="margin:10px 2px 0;font-size:13.5px;color:var(--faint)">Na prévia, as cotações são de exemplo.</p>`),
    personalizar: () => openSheet('Personalizar Início', `
      <p style="margin:0 2px 12px;color:var(--soft);font-size:15px">Escolha o que aparece no Início. O saldo e os atalhos ficam sempre no topo. Na versão final, também dá para ordenar.</p>
      <div class="group">${[['agora', 'Agora: próximo compromisso e tarefas'], ['precisa', 'Precisa de você'], ['habitos', 'Hábitos de hoje'], ['prazos', 'Prazos de projetos'], ['movs', 'Movimentações recentes'], ['metas', 'Metas']].map(([k, n]) => `<div class="row plain"><span class="t"><span class="t1" style="font-weight:500">${n}</span></span><button class="toggle" type="button" role="switch" aria-checked="${S.home[k]}" aria-label="${n}" data-home="${k}"></button></div>`).join('')}</div>`,
      `<button class="btn primary block" type="button" data-home-save>Pronto</button>`),
    barra: () => openSheet('Barra inferior', `
      <p style="margin:0 2px 12px;color:var(--soft);font-size:15px">Início e Assistente ficam fixos. Escolha as três abas do meio; o resto continua no menu ☰.</p>
      <div class="group">${[['Agenda', 'cal', true], ['Finanças', 'wallet', true], ['Projetos', 'folder', true], ['Tarefas', 'task', false], ['Vendas', 'dollar', false], ['Rotina', 'repeat', false], ['Clientes', 'users', false]].map(([n, i, on]) => `<div class="row"><span class="tile">${ico(i, 's')}</span><span class="t"><span class="t1">${n}</span></span><button class="toggle" type="button" role="switch" aria-checked="${on}" aria-label="${n} na barra"></button></div>`).join('')}</div>`,
      `<button class="btn primary block" type="button" data-close-toast="${DEMO}a barra não muda na prévia">Pronto</button>`),
    acoes: () => openSheet('Mais ações', `
      <div class="group">
        <button class="row" type="button" data-toast="${DEMO}duplicaria o projeto"><span class="tile">${ico('plus', 's')}</span><span class="t"><span class="t1">Duplicar projeto</span></span></button>
        <button class="row" type="button" data-toast="${DEMO}adicionaria ao Portfólio"><span class="tile">${ico('brief', 's')}</span><span class="t"><span class="t1">Adicionar ao Portfólio</span></span></button>
        <button class="row" type="button" data-toast="${DEMO}pausaria o projeto"><span class="tile">${ico('clock', 's')}</span><span class="t"><span class="t1">Pausar projeto</span></span></button>
      </div>
      <div class="group" style="margin-top:12px"><button class="row" type="button" data-toast="${DEMO}pediria confirmação antes de excluir"><span class="tile red">${ico('x', 's')}</span><span class="t"><span class="t1" style="color:var(--expense)">Excluir projeto…</span></span></button></div>`),
    sobre: () => openSheet('O que funciona na prévia', `
      <p style="margin:0 2px 4px;color:var(--soft);font-size:15px">Tudo usa dados fictícios, guardados só enquanto a página está aberta. Nada chega ao Núcleo publicado.</p>
      <div class="legend-h">Funciona de verdade</div>
      <ul class="legend">
        <li>Barra inferior, menu ☰ e a busca do menu (áreas e registros)</li>
        <li>Filtros, Hoje/Semana, busca de movimentações</li>
        <li>Marcar tarefas e registrar hábitos (com desfazer)</li>
        <li>Nova entrada, Nova saída, Nova tarefa, Novo compromisso, Novo projeto e Registrar pagamento: salvam, atualizam as telas e oferecem desfazer</li>
        <li>Abrir qualquer projeto, Personalizar Início (mostrar ou ocultar blocos)</li>
        <li>Cartão de saldo em Finanças: moeda de exibição (cotações de exemplo), variação depois de um lançamento e Reservado para metas / Disponível</li>
        <li>Tema, barra sem transparência e cenários Normal, Muitos e Vazio</li>
      </ul>
      <div class="legend-h">Só demonstração</div>
      <ul class="legend">
        <li>Assistente: só o visual; ele não responde</li>
        <li>Frase do “Novo”: só mostra como entenderia; não salva</li>
        <li>Notificações, voz, Editar, ações do “⋯”, Confirmar pagamento, telas fora da prévia e a escolha das abas da barra</li>
      </ul>
      <p style="margin:12px 2px 0;font-size:14px;color:var(--faint)">Botões de demonstração mostram um aviso começando com “Demonstração”.</p>`),
  };

  // ---------- menu drawer ----------
  const drawer = document.getElementById('drawer'), mscrim = document.getElementById('menu-scrim');
  const desktop = () => matchMedia('(min-width: 1024px)').matches;
  function openMenu() { renderMenu(route()); mscrim.hidden = false; requestAnimationFrame(() => { drawer.classList.add('open'); mscrim.classList.add('open'); }); setTimeout(() => document.getElementById('menu-close').focus({ preventScroll: true }), 60); }
  function closeMenu() { if (desktop()) return; drawer.classList.remove('open'); mscrim.classList.remove('open'); setTimeout(() => { mscrim.hidden = true; }, 300); }

  // ---------- toast ----------
  let toastTimer;
  function toast(text, undo) {
    const el = document.getElementById('toast');
    document.getElementById('toast-text').textContent = text;
    const u = document.getElementById('toast-undo');
    u.hidden = !undo; u.onclick = () => { undo && undo(); el.classList.remove('show'); render(); };
    el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3400);
  }

  // ---------- render ----------
  let io;
  function render() {
    const cur = route();
    renderTabs(cur);
    renderMenu(cur);
    const app = document.getElementById('app');
    app.innerHTML = SCREENS[cur]();
    app.className = cur === 'projeto' && app.querySelector('.dock') ? 'has-dock' : cur === 'assistente' ? 'has-composer' : '';
    const p = S.projects.find((x) => x.id === S.detail);
    document.getElementById('compact-title').textContent = cur === 'projeto' && p ? p.name : TITLES[cur];
    document.getElementById('compact-action').innerHTML = compactAction;
    const t = document.getElementById('page-title'), compact = document.getElementById('compact');
    if (io) io.disconnect();
    compact.classList.remove('show'); compact.setAttribute('aria-hidden', 'true');
    if (t && cur !== 'assistente' && 'IntersectionObserver' in window) {
      io = new IntersectionObserver(([e]) => { const on = !e.isIntersecting && e.boundingClientRect.top < 0; compact.classList.toggle('show', on); compact.setAttribute('aria-hidden', String(!on)); compact.querySelectorAll('button').forEach((b) => (b.tabIndex = on ? 0 : -1)); }, { rootMargin: '-50px 0px 0px 0px' });
      io.observe(t);
    }
    if (cur === 'financas') runBalanceAnim(); else S.anim = null;
    const form = document.getElementById('composer');
    if (form) form.addEventListener('submit', (e) => { e.preventDefault(); const v = val('say-in').trim(); if (!v) return; S.chat.push(['me', v], ['it', 'Na prévia o Assistente não responde. Esta tela mostra só o visual da conversa.']); render(); window.scrollTo(0, document.body.scrollHeight); });
  }
  let lastRoute = route();
  window.addEventListener('hashchange', () => { const r = route(); closeMenu(); if (!sheet.el.hidden) closeSheet(); render(); if (r !== lastRoute) window.scrollTo(0, 0); lastRoute = r; });

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, a');
    if (!b) return;
    const d = b.dataset;
    if (d.openMenu !== undefined) return openMenu();
    if (b.id === 'menu-close') return closeMenu();
    if (b.id === 'sheet-close') return closeSheet();
    if (b.id === 'form-save') { if (!sheet.onSave) return; const [msg, undo] = sheet.onSave(); closeSheet(); render(); return toast(msg, undo); }
    if (d.new !== undefined) { closeMenu(); return openNew(); }
    if (d.formTask !== undefined) { closeMenu(); return openTaskForm(d.project || (route() === 'projeto' ? S.detail : '')); }
    if (d.formEvent !== undefined) return openEventForm();
    if (d.formProject !== undefined) return openProjectForm();
    if (d.formPay !== undefined) return openPaymentForm();
    if (d.open) { S.detail = d.open; closeMenu(); return go('projeto'); }
    if (d.go) { if (!sheet.el.hidden) closeSheet(); closeMenu(); return go(d.go); }
    if (d.ask) { S.chat.push(['me', d.ask], ['it', 'Na prévia o Assistente não responde. Esta tela mostra só o visual da conversa.']); S.mq = ''; document.getElementById('mq').value = ''; closeMenu(); return go('assistente'); }
    if (d.say) { const inp = document.getElementById('say-in'); inp.value = d.say; inp.focus(); return; }
    if (d.task) { const t = S.tasks.find((x) => x.id === d.task); if (!t) return; t.done = !t.done; render(); return toast(t.done ? 'Tarefa concluída' : 'Tarefa reaberta', () => { t.done = !t.done; }); }
    if (d.habit) { const h = S.habits.find((x) => x.id === d.habit); if (!h) return; const before = h.n; h.n = habitDone(h) && !h.unit ? 0 : Math.min(h.goal, h.n + h.step); render(); return toast(`${h.name}: ${habitText(h)}`, () => { h.n = before; }); }
    if (d.afilter) { S.agendaFilter = d.afilter; return render(); }
    if (d.aview) { S.agendaView = d.aview; return render(); }
    if (d.wday) { S.weekDay = +d.wday; return render(); }
    if (d.mfilter) { S.moneyFilter = d.mfilter; return render(); }
    if (d.mclear !== undefined) { S.moneyFilter = 'tudo'; S.moneyQ = ''; return render(); }
    if (d.pfilter) { if (!sheet.el.hidden) closeSheet(); S.projFilter = d.pfilter; return render(); }
    if (d.form) { closeMenu(); return openMoneyForm(d.form, d.edit); }
    if (d.kind) { const amt = val('amt'), desc = val('desc'); openMoneyForm(d.kind, sheet.el.dataset.edit); document.getElementById('amt').value = amt; document.getElementById('desc').value = desc; return checkForm(); }
    if (d.pick) { b.parentElement.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c === b)); return; }
    if (d.sheet) { closeMenu(); return SHEETS[d.sheet](); }
    if (d.curSet) { S.cur = d.curSet; closeSheet(); return render(); }
    if (d.scenario) { loadScenario(d.scenario); render(); return toast(`Cenário: ${b.textContent}`); }
    if (d.homeSave !== undefined) { document.querySelectorAll('[data-home]').forEach((x) => (S.home[x.dataset.home] = x.getAttribute('aria-checked') === 'true')); closeSheet(); render(); return toast('Início atualizado'); }
    if (b.classList.contains('toggle')) { const on = b.getAttribute('aria-checked') !== 'true'; b.setAttribute('aria-checked', on); if (b.id === 'solid') { document.body.classList.toggle('solid', on); pref('solid', on ? '1' : ''); } return; }
    if (d.themeSet) { if (d.themeSet === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = d.themeSet; pref('theme', d.themeSet); syncTheme(); render(); return; }
    if (d.closeToast) { closeSheet(); return toast(d.closeToast); }
    if (d.toast) { if (!sheet.el.hidden && b.closest('.sheet') && !b.closest('details')) closeSheet(); return toast(d.toast); }
  });
  mscrim.addEventListener('click', closeMenu);
  sheet.scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (!sheet.el.hidden) closeSheet(); else closeMenu(); });
  let sx = null;
  drawer.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  drawer.addEventListener('touchend', (e) => { if (sx !== null && sx - e.changedTouches[0].clientX > 70) closeMenu(); sx = null; });
  document.addEventListener('input', (e) => {
    if (e.target.closest('.sheet')) checkForm();
    if (e.target.id === 'say') document.getElementById('guess').innerHTML = guess(e.target.value);
    if (e.target.id === 'mq') { S.mq = e.target.value; renderMenu(route()); }
    if (e.target.id === 'money-q') { S.moneyQ = e.target.value; const pos = e.target.selectionStart; render(); const n = document.getElementById('money-q'); n.focus(); n.setSelectionRange(pos, pos); }
  });
  const isText = (el) => el && el.matches && el.matches('input:not([type=checkbox]):not([type=radio]), textarea, select');
  const coarse = () => matchMedia('(pointer: coarse)').matches;
  document.addEventListener('focusin', (e) => { if (isText(e.target) && coarse()) document.body.classList.add('typing'); });
  document.addEventListener('focusout', () => setTimeout(() => { if (!isText(document.activeElement)) document.body.classList.remove('typing'); }, 50));
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { document.body.classList.toggle('typing', visualViewport.height < window.innerHeight * 0.78 || (isText(document.activeElement) && coarse())); });

  // Which theme is showing (chosen, or the device's): drives the white type on the orange areas in dark.
  const darkQuery = matchMedia('(prefers-color-scheme: dark)');
  function syncTheme() { const t = document.documentElement.dataset.theme; document.documentElement.classList.toggle('is-dark', t ? t === 'dark' : darkQuery.matches); }
  darkQuery.addEventListener('change', syncTheme);
  const th = pref('theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
  syncTheme();
  if (pref('solid') === '1') document.body.classList.add('solid');
  render();
})();
</script>
</body>
</html>
