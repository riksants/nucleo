name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs; only the publishing job can write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Nothing is published when a test or the lint fails (A7).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # Same zone as the people using the app; the date tests also run in it locally.
          TZ: America/Sao_Paulo

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public values (GitHub → Settings → Variables). Empty = app works only on the device, as before.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # NÚCLEO IA: ligada por padrão desde 2026-11-05. Para desligar no app: variável VITE_NUCLEO_IA=off
          # (GitHub → Settings → Variables) e novo deploy. O desligamento imediato é no banco (teto global 0).
          VITE_NUCLEO_IA: ${{ vars.VITE_NUCLEO_IA || 'on' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          # Cloudflare Turnstile SITE key (public). The secret key goes only to Supabase Auth → Attack Protection.
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          # Monitoramento (PARTE 14). DSN é PÚBLICO (Variable); vazio = Sentry desligado. Release = commit.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_RELEASE: ${{ github.sha }}
          # Upload de source maps ao Sentry: SÓ o token é secreto (Secret, nunca VITE_). Org/Project são Variables.
          # Sem o token, o build apenas não gera/sobe maps (app continua funcionando).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  # Jornadas críticas de autenticação/segurança no navegador (login, sessão, troca A→B, recuperação,
  # exclusão de conta, rota privada), contra o mock LOCAL do Supabase — nunca produção, nunca e-mail
  # real, nunca custo externo. Se uma quebrar, o deploy é bloqueado (deploy needs: [build, e2e]).
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:e2e-cloud
      - name: Localiza o Chrome do runner
        id: chrome
        run: echo "path=$(which google-chrome || which chromium-browser || which chromium)" >> "$GITHUB_OUTPUT"
      - name: E2E crítico (auth/segurança no mock local)
        run: npm run e2e:critical
        env:
          # O runner Linux usa Chromium via EDGE_PATH; cdp.mjs liga --no-sandbox quando CI está setado.
          EDGE_PATH: ${{ steps.chrome.outputs.path }}
          TZ: America/Sao_Paulo

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
